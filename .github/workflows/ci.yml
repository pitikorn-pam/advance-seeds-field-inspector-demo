name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint (workspace recursive)
        run: pnpm -r lint

      - name: Typecheck (workspace recursive)
        run: pnpm -r typecheck

      - name: Test (workspace recursive)
        run: pnpm -r --if-present test

  openspec:
    name: OpenSpec validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: Validate all active changes
        run: |
          set -e
          shopt -s nullglob
          for dir in openspec/changes/*/; do
            name="$(basename "$dir")"
            # The `archive/` subdirectory holds completed changes; skip it.
            if [ "$name" = "archive" ]; then continue; fi
            echo "→ Validating $name"
            openspec validate "$name"
          done
