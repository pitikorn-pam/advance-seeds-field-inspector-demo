schema: spec-driven

# Project context — read by the AI before drafting any artifact.
# Keep this in sync with reality; specs inherit from here.
context: |
  PROJECT
  Advance Seeds Field Inspector — presale client demo (not production).
  Purpose: prove product concept and design vision; win the build phase.
  Real ML (YOLOv11n via Ultralytics) is mocked for the demo and integrated post-win.

  ONE SURFACE, ONE BACKEND
  - Native mobile (field inspector) — Expo (React Native) + TS, distributed via Firebase App Distribution
  - Backend: Supabase (Postgres + Auth + Storage + RLS)

  DESIGN SYSTEM
  Source of truth: docs/handoff/design-tokens.json. Tokens flow into:
    - apps/mobile via NativeWind (Tailwind for RN)
    - packages/tokens generates the TS export from the JSON
  Reference platform stubs (docs/handoff/DesignTokens.swift, Theme.kt) preserved for
  the eventual native iOS/Android build phase. Do not drift from token names.

  MOBILE APP STACK
  - Expo SDK 52+ (RN 0.76+ New Architecture)
  - TypeScript (strict)
  - Expo Router (file-based)
  - NativeWind (Tailwind for RN, mirrors web tokens)
  - TanStack Query, Supabase JS SDK
  - expo-camera, expo-image-picker, expo-localization
  - i18next (en, th)
  - Light/dark via NativeWind dark: variants
  - ML adapter pattern: SeedAnalyzer interface; demo ships MockSeedAnalyzer.
    Build phase swaps in TfliteSeedAnalyzer (react-native-fast-tflite) and
    optionally a CoreMLSeedAnalyzer custom Expo Module. No screen changes.
  - Distribution: Expo Go QR for demo day; EAS Build later.

  BACKEND — SUPABASE
  - Project URL configured in .env files (gitignored); anon key public-by-design.
  - Tables: profiles, varieties, batches, inspections, seeds, calibration_profiles.
  - RLS: inspector role sees only own rows; admin role sees all + manages reference data.
  - Storage bucket: inspection-images (public read for demo simplicity).
  - Auth: email + password.
  - Seeded users:
      jane@advanceseeds.com  — role: inspector
      alex@advanceseeds.com  — role: admin
  - Schema + RLS + seed live in supabase/ as migrations and seed.sql.

  CRUD SCOPE (DEMO V1)
  Full CRUD: Inspections, Varieties, Batches (mobile).
  Read-only: Profiles (users), Calibration profiles.
  Bonus screens: Settings, Calibration view, Reports/CSV exports.

  DEMO BEHAVIOR
  - 5–7 pre-baked sample inspections seeded.
  - "+ New inspection" simulates ~2-second analysis on a fixed sample image,
    returns one of two pre-baked result sets, persists as a real DB row.
  - Seed photos: public CC0 from Pixabay/Unsplash, stored in Supabase Storage.

  I18N
  English (default) + Thai. Toggle in Settings; respects device locale on first launch.
  No raw English strings in components — all UI strings via t().

  REPO LAYOUT (pnpm monorepo)
    apps/mobile             → Expo app
    packages/tokens         → TS tokens generated from design-tokens.json
    packages/types          → Supabase generated types
    supabase/               → migrations, seed.sql, RLS policies, types codegen
    docs/handoff/           → original design system handoff (preserved)
    openspec/               → spec-driven dev artifacts
    .github/workflows/      → CI

  TIMELINE — ~2.5 WEEKS
  Week 1: monorepo scaffold, Supabase schema/RLS/seed, mobile auth.
  Week 2: Expo shell + nav, mobile CRUD, capture flow with mocked ML.
  Week 2.5: EN/TH i18n, light/dark polish, reports/CSV, dry-run.

  CONVENTIONS
  - TypeScript strict everywhere; no `any` without justification comment.
  - Conventional commits (feat:, fix:, chore:, docs:, refactor:, test:).
  - ESLint + Prettier; format-on-save.
  - Supabase types regenerated via `pnpm supabase:types` after every schema change.
  - All UI text via t() — never hardcoded strings.
  - Token names match design-tokens.json — no inline hex/px outside the token layer.
  - Two roles only (inspector, admin); enforce in RLS, not just UI.

# Per-artifact rules
rules:
  proposal:
    - State the user-visible outcome first; technical detail belongs in design.md.
    - Always include a "Non-goals" section to prevent scope creep.
    - Keep under 500 words.
  design:
    - Include data model (tables + columns + RLS intent) when DB is touched.
    - Call out the abstraction seam if a future swap is anticipated (e.g. ML adapter).
    - Show file/folder layout for any new package or app.
  tasks:
    - Group by phase (Scaffold / Schema / Backend / Mobile / Polish / Deploy).
    - Each task max ~2 hours; if larger, split.
    - Mark blocking dependencies explicitly.
  specs:
    - Every requirement gets at least one scenario (Given/When/Then).
    - Scenarios are concrete and testable, not aspirational.
